name: Sandbox boundaries
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openai requests
      - run: docker build -t orpi-sandbox:1 .
      - run: python -m unittest test_sandbox -v
        env:
          DOCKER_TESTS: '1'
